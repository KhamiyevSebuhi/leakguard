[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leakguard"
version = "0.1.0"
description = "Local, redaction-first secret scanning for files and Git"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.9", "hypothesis>=6", "mutmut>=3.8,<4"]

[project.scripts]
leakguard = "leakguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["perf: generous bounded performance checks"]

[tool.coverage.run]
source = ["leakguard"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = ["if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607", "S105", "S106", "S108"]
"src/leakguard/gitutils.py" = ["S603", "S607"]
"src/leakguard/hook.py" = ["S101"]

[tool.mutmut]
source_paths = ["src/leakguard/"]
only_mutate = ["src/leakguard/rules.py", "src/leakguard/entropy.py"]
pytest_add_cli_args_test_selection = ["tests/"]
